<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="weather.css">
    <title>Weather App</title>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <div class="search-bar">
            <input placeholder="Search City" class="search-bar-input">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="weather-results">
            <div class="weather-info">
                <span class="weather-icon"><i class="fa-regular fa-sun"></i></span>
                <h2 class="temperature">24°C</h2>
                <h3><i class="fa-solid fa-location-dot"></i><span class="city">Tokyo</span></h3>
            </div>

            <div class="weather-details">
                <div class="wind-humidity-speed">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <h4>Wind-Speed</h4>
                        <p class="wind-speed">45 km/h</p>
                    </div>
                </div>
                <div class="wind-humidity-speed">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <h4>Humidity</h4>
                        <p class="humidity">80%</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="weather.js"></script>
</body>
</html>
